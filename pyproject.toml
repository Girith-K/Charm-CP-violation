# package setup, pip install -e .

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charm-acp"
version = "3.2.0"
description = "Direct CP violation in charm decays (ΔA_CP) from LHCb open data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "iminuit>=2.25",
    "uproot>=5.3",
    "matplotlib>=3.8",
    "mplhep>=0.3.50",
]

[project.optional-dependencies]
report = ["python-docx>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
